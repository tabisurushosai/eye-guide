<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-muted: #eef2f7;
      --text: #172033;
      --muted: #5d6878;
      --border: #d7dde7;
      --primary: #265ecf;
      --primary-strong: #1e4faa;
      --success-bg: #e7f6ee;
      --success-text: #155f35;
      --warning-bg: #fff4d6;
      --warning-text: #7a5200;
      --focus: #1f6feb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: 0.01em;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(31, 111, 235, 0.28);
      outline-offset: 2px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(21, 30, 48, 0.08);
    }

    .status-card {
      min-height: 38px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-muted);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .status-card[data-state="success"] {
      border-color: #b7e2c8;
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status-card[data-state="warning"] {
      border-color: #efd176;
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .setting-item {
      display: grid;
      grid-template-columns: minmax(92px, 1fr) minmax(0, 1.7fr);
      gap: 10px;
      align-items: center;
    }

    .setting-item label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input[type="color"] {
      width: 100%;
      min-height: 36px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    select {
      width: 100%;
      min-height: 36px;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }

    .range-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 46px;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    output {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .checkbox-row {
      justify-content: start;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .preset-btn {
      min-width: 0;
      width: 100%;
      height: 30px;
      min-height: 30px;
      padding: 0;
      border: 1px solid rgba(23, 32, 51, 0.32);
      border-radius: 9px;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary-btn {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .primary-btn:hover {
      background: var(--primary-strong);
    }

    .secondary-btn:hover {
      background: var(--surface-muted);
    }

    .upgrade-container {
      display: none;
    }

    .upgrade-btn {
      width: 100%;
      border-color: #b78b00;
      background: #ffe28a;
      color: #4f3600;
    }

    .action-status {
      min-height: 22px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .action-status[data-tone="success"] {
      color: var(--success-text);
      font-weight: 700;
    }

    .action-status[data-tone="warning"] {
      color: var(--warning-text);
      font-weight: 700;
    }

    .premium-lock {
      opacity: 0.48;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1 id="title"></h1>
    <section class="settings" aria-labelledby="title">
      <div id="premium-status" class="status-card" aria-live="polite"></div>
      <div class="setting-item">
        <label id="label-color" for="color">色:</label>
        <input type="color" id="color" value="#ffff00">
      </div>
      <div class="setting-item" id="presets-container">
        <label id="label-presets">プリセット:</label>
        <div class="presets">
          <button class="preset-btn" type="button" data-color="#ffff00" style="background:#ffff00" aria-label="Yellow"></button>
          <button class="preset-btn" type="button" data-color="#00ff00" style="background:#00ff00" aria-label="Green"></button>
          <button class="preset-btn" type="button" data-color="#00ffff" style="background:#00ffff" aria-label="Cyan"></button>
          <button class="preset-btn" type="button" data-color="#ff00ff" style="background:#ff00ff" aria-label="Magenta"></button>
        </div>
      </div>
      <div class="setting-item">
        <label id="label-thickness" for="thickness">太さ:</label>
        <div class="range-control">
          <input type="range" id="thickness" min="1" max="100" value="4">
          <output id="thickness-value" for="thickness">4px</output>
        </div>
      </div>
      <div class="setting-item">
        <label id="label-opacity" for="opacity">不透明度:</label>
        <div class="range-control">
          <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.5">
          <output id="opacity-value" for="opacity">50%</output>
        </div>
      </div>
      <div class="setting-item">
        <label id="label-mode" for="mode">モード:</label>
        <select id="mode">
          <option id="mode-horizontal" value="horizontal">横帯</option>
          <option id="mode-underline" value="underline">下線</option>
          <option id="mode-window" value="window">集中窓</option>
        </select>
      </div>
      <div class="setting-item checkbox-row" id="auto-on-container">
        <label id="label-auto-on" for="auto-on">自動ON:</label>
        <input type="checkbox" id="auto-on">
      </div>
    </section>
    <div class="btn-group">
      <button class="primary-btn" id="toggle-on" type="button">ON</button>
      <button class="secondary-btn" id="toggle-off" type="button">OFF</button>
    </div>
    <div id="action-status" class="action-status" aria-live="polite"></div>
    <div id="upgrade-container" class="upgrade-container">
      <button id="btn-upgrade" class="upgrade-btn" type="button"></button>
    </div>
  </main>
  <script type="module" src="src/popup.ts"></script>
</body>
</html>
