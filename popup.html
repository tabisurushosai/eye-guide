<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>すーっと読める定規</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      --bg: #eaf0f8;
      --surface: #ffffff;
      --surface-muted: #f6f8fc;
      --text: #111d2f;
      --muted: #3d5068;
      --border: #b8c7da;
      --divider: #dfe7f1;
      --primary: #205bc8;
      --primary-strong: #184bab;
      --primary-soft: #e8f0ff;
      --info-bg: #edf4ff;
      --info-border: #a9c2eb;
      --info-text: #184b99;
      --success-bg: #e6f6ef;
      --success-border: #8dcca9;
      --success-text: #0f5a32;
      --warning-bg: #fff4cf;
      --warning-border: #d9ae32;
      --warning-text: #634200;
      --focus: #0b57d0;
      --focus-shadow: rgba(11, 87, 208, 0.22);
      --control-shadow: 0 1px 2px rgba(20, 32, 51, 0.06);
      --shadow: 0 16px 38px rgba(17, 29, 47, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 376px;
      margin: 0;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0) 160px),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: 0.005em;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: var(--control-shadow);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      box-shadow: 0 0 0 4px var(--focus-shadow);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 2px 4px 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 16px;
      border: 1px solid rgba(184, 199, 218, 0.92);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .status-card,
    .action-status {
      position: relative;
      box-shadow: var(--control-shadow);
    }

    .status-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 44px;
      padding: 12px 13px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 14px;
      background: var(--surface-muted);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    .status-card::before,
    .action-status::before {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      margin-top: 5px;
      border-radius: 999px;
      background: currentColor;
      content: "";
    }

    .status-card[aria-busy="true"]::before,
    .action-status[aria-busy="true"]::before {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      background: transparent;
    }

    .onboarding-card {
      padding: 15px;
      border: 1px solid var(--info-border);
      border-left: 4px solid var(--primary);
      border-radius: 16px;
      background: var(--info-bg);
      color: var(--text);
      box-shadow: var(--control-shadow);
    }

    .onboarding-card h2 {
      margin: 0 0 7px;
      font-size: 15px;
      line-height: 1.35;
    }

    .onboarding-card p {
      margin: 0;
      color: #40526a;
      font-size: 13px;
      line-height: 1.55;
    }

    .onboarding-steps {
      display: grid;
      gap: 8px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .onboarding-steps li {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      align-items: start;
      padding: 9px 10px;
      border: 1px solid var(--info-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      color: #2b3d55;
      font-size: 13px;
      line-height: 1.45;
    }

    .onboarding-steps strong {
      display: block;
      color: var(--primary-strong);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .onboarding-step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
    }

    .onboarding-card .onboarding-tip {
      margin-top: 12px;
      padding: 10px 11px;
      border: 1px solid var(--info-border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--primary-strong);
      font-weight: 700;
    }

    .status-card[data-state="info"] {
      border-color: var(--info-border);
      background: var(--info-bg);
      color: var(--info-text);
    }

    .status-card[data-state="success"] {
      border-color: var(--success-border);
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status-card[data-state="warning"] {
      border-color: var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .setting-item {
      display: grid;
      grid-template-columns: minmax(112px, 0.92fr) minmax(0, 1.55fr);
      gap: 14px;
      align-items: center;
      min-height: 48px;
      padding: 13px 0;
      border-top: 1px solid var(--divider);
    }

    .setting-item label,
    .setting-label {
      display: flex;
      align-items: center;
      min-height: 48px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .setting-item:focus-within {
      border-radius: 12px;
      box-shadow: inset 0 0 0 2px rgba(11, 87, 208, 0.16);
    }

    input[type="color"] {
      width: 100%;
      min-height: 48px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--control-shadow);
    }

    select {
      width: 100%;
      min-height: 48px;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: var(--control-shadow);
    }

    .range-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 60px;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      min-height: 48px;
      margin: 0;
      accent-color: var(--primary);
    }

    output {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 32px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .checkbox-row {
      justify-content: start;
    }

    input[type="checkbox"] {
      width: 48px;
      height: 48px;
      margin: 0;
      accent-color: var(--primary);
      justify-self: start;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .preset-btn {
      min-width: 0;
      width: 100%;
      height: 52px;
      min-height: 52px;
      padding: 0;
      border: 2px solid #26364d;
      border-radius: 11px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.72), var(--control-shadow);
    }

    .preset-btn[aria-checked="true"] {
      border-color: var(--text);
      box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 5px var(--text), var(--control-shadow);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .primary-btn {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(36, 93, 204, 0.24);
    }

    .primary-btn:hover {
      background: var(--primary-strong);
    }

    .secondary-btn:hover {
      background: var(--surface-muted);
    }

    .upgrade-container {
      display: none;
    }

    .upgrade-btn {
      width: 100%;
      border-color: #b78b00;
      background: #ffe28a;
      color: #4f3600;
    }

    .action-status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 44px;
      padding: 12px 13px;
      border: 1px solid var(--info-border);
      border-left-width: 4px;
      border-radius: 14px;
      background: var(--info-bg);
      color: var(--info-text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    .action-status[data-tone="success"] {
      border-color: var(--success-border);
      background: var(--success-bg);
      color: var(--success-text);
    }

    .action-status[data-tone="warning"] {
      border-color: var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .premium-lock label,
    .premium-lock .setting-label {
      color: var(--muted);
    }

    [hidden] {
      display: none !important;
    }

    @media (forced-colors: active) {
      .preset-btn,
      .preset-btn[aria-checked="true"] {
        border-color: ButtonText;
        box-shadow: none;
      }

      .preset-btn[aria-checked="true"] {
        outline: 3px solid Highlight;
        outline-offset: 2px;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <header class="header">
      <h1 id="title"></h1>
      <p id="subtitle" class="subtitle"></p>
    </header>
    <section id="onboarding-guide" class="onboarding-card" aria-labelledby="onboarding-title" aria-describedby="onboarding-body onboarding-tip" hidden>
      <h2 id="onboarding-title"></h2>
      <p id="onboarding-body"></p>
      <ol class="onboarding-steps">
        <li>
          <span class="onboarding-step-number" aria-hidden="true">1</span>
          <span>
            <strong id="onboarding-step-page-title"></strong>
            <span id="onboarding-step-page"></span>
          </span>
        </li>
        <li>
          <span class="onboarding-step-number" aria-hidden="true">2</span>
          <span>
            <strong id="onboarding-step-on-title"></strong>
            <span id="onboarding-step-on"></span>
          </span>
        </li>
      </ol>
      <p id="onboarding-tip" class="onboarding-tip"></p>
    </section>
    <section class="settings" aria-labelledby="settings-title" aria-describedby="subtitle">
      <h2 id="settings-title" class="sr-only">読書ライン設定</h2>
      <div id="premium-status" class="status-card" data-state="info" role="status" aria-live="polite" aria-atomic="true" aria-busy="true">プレミアムの利用状況を確認しています...</div>
      <div class="setting-item">
        <label id="label-color" for="color">色</label>
        <input type="color" id="color" value="#ffff00">
      </div>
      <div class="setting-item" id="presets-container">
        <span id="label-presets" class="setting-label">色プリセット</span>
        <div id="preset-group" class="presets" role="radiogroup" aria-labelledby="label-presets" aria-describedby="preset-help">
          <button class="preset-btn" type="button" role="radio" data-color="#ffff00" data-label-key="presetYellow" style="background:#ffff00" aria-label="黄色のプリセットを選択" aria-checked="true" tabindex="0"></button>
          <button class="preset-btn" type="button" role="radio" data-color="#00ff00" data-label-key="presetGreen" style="background:#00ff00" aria-label="緑色のプリセットを選択" aria-checked="false" tabindex="-1"></button>
          <button class="preset-btn" type="button" role="radio" data-color="#00ffff" data-label-key="presetCyan" style="background:#00ffff" aria-label="シアンのプリセットを選択" aria-checked="false" tabindex="-1"></button>
          <button class="preset-btn" type="button" role="radio" data-color="#ff00ff" data-label-key="presetMagenta" style="background:#ff00ff" aria-label="マゼンタのプリセットを選択" aria-checked="false" tabindex="-1"></button>
        </div>
        <p id="preset-help" class="sr-only">矢印キー、Home、Endキーでプリセット色を選択できます。</p>
      </div>
      <div class="setting-item">
        <label id="label-thickness" for="thickness">太さ</label>
        <div class="range-control">
          <input type="range" id="thickness" min="1" max="100" value="4" aria-describedby="thickness-value">
          <output id="thickness-value" for="thickness" aria-live="polite" aria-atomic="true">4px</output>
        </div>
      </div>
      <div class="setting-item">
        <label id="label-opacity" for="opacity">不透明度</label>
        <div class="range-control">
          <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.5" aria-describedby="opacity-value">
          <output id="opacity-value" for="opacity" aria-live="polite" aria-atomic="true">50%</output>
        </div>
      </div>
      <div class="setting-item">
        <label id="label-mode" for="mode">モード</label>
        <select id="mode">
          <option id="mode-horizontal" value="horizontal">横帯</option>
          <option id="mode-underline" value="underline">下線</option>
          <option id="mode-window" value="window">集中窓</option>
        </select>
      </div>
      <div class="setting-item checkbox-row" id="auto-on-container">
        <label id="label-auto-on" for="auto-on">このサイトでは自動的にオン</label>
        <input type="checkbox" id="auto-on">
      </div>
    </section>
    <div class="btn-group" role="group" aria-labelledby="action-controls-label">
      <span id="action-controls-label" class="sr-only">読書ラインの表示操作</span>
      <button class="primary-btn" id="toggle-on" type="button" aria-describedby="action-status">オン</button>
      <button class="secondary-btn" id="toggle-off" type="button" aria-describedby="action-status">オフ</button>
    </div>
    <div id="action-status" class="action-status" data-tone="info" role="status" aria-live="polite" aria-atomic="true" aria-busy="true">設定を読み込んでいます...</div>
    <div id="upgrade-container" class="upgrade-container">
      <button id="btn-upgrade" class="upgrade-btn" type="button" aria-describedby="premium-status"></button>
    </div>
  </main>
  <script type="module" src="src/popup.ts"></script>
</body>
</html>
