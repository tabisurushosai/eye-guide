<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>すーっと読める定規</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-muted: #eef3f9;
      --text: #142033;
      --muted: #4f5f73;
      --border: #cfd8e6;
      --divider: #e6edf6;
      --primary: #245dcc;
      --primary-strong: #1d4ea8;
      --info-bg: #edf4ff;
      --info-border: #bfd2f2;
      --info-text: #1f4f9c;
      --success-bg: #e7f6ee;
      --success-border: #adddc0;
      --success-text: #155f35;
      --warning-bg: #fff4d6;
      --warning-border: #e7c45f;
      --warning-text: #6f4b00;
      --focus: #0b57d0;
      --shadow: 0 10px 28px rgba(20, 32, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 352px;
      margin: 0;
      padding: 18px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: 0.01em;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      box-shadow: 0 0 0 2px var(--surface);
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 2px 2px 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .status-card {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-height: 44px;
      padding: 10px 12px;
      margin-bottom: 2px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-muted);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .status-card::before,
    .action-status::before {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      margin-top: 5px;
      border-radius: 999px;
      background: currentColor;
      content: "";
    }

    .onboarding-card {
      padding: 13px 14px;
      border: 1px solid var(--info-border);
      border-radius: 14px;
      background: var(--info-bg);
      color: var(--text);
    }

    .onboarding-card h2 {
      margin: 0 0 6px;
      font-size: 14px;
      line-height: 1.35;
    }

    .onboarding-card p {
      margin: 0;
      color: #40526a;
      font-size: 13px;
    }

    .onboarding-card .onboarding-route {
      margin-top: 8px;
      color: #2b3d55;
      font-weight: 700;
    }

    .onboarding-card .onboarding-tip {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid var(--info-border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--primary-strong);
      font-weight: 700;
    }

    .onboarding-card .onboarding-action {
      margin-top: 8px;
      color: var(--primary-strong);
      font-weight: 700;
    }

    .status-card[data-state="info"] {
      border-color: var(--info-border);
      background: var(--info-bg);
      color: var(--info-text);
    }

    .status-card[data-state="success"] {
      border-color: var(--success-border);
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status-card[data-state="warning"] {
      border-color: var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .setting-item {
      display: grid;
      grid-template-columns: minmax(104px, 0.9fr) minmax(0, 1.6fr);
      gap: 12px;
      align-items: center;
      min-height: 44px;
      padding: 11px 0;
      border-top: 1px solid var(--divider);
    }

    .setting-item label {
      display: flex;
      align-items: center;
      min-height: 44px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    .setting-item:focus-within {
      border-radius: 12px;
      box-shadow: inset 0 0 0 2px rgba(11, 87, 208, 0.18);
    }

    input[type="color"] {
      width: 100%;
      min-height: 44px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    select {
      width: 100%;
      min-height: 44px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
    }

    .range-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 54px;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      min-height: 44px;
      margin: 0;
      accent-color: var(--primary);
    }

    output {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .checkbox-row {
      justify-content: start;
    }

    input[type="checkbox"] {
      width: 44px;
      height: 44px;
      margin: 0;
      accent-color: var(--primary);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .preset-btn {
      min-width: 0;
      width: 100%;
      height: 48px;
      min-height: 48px;
      padding: 0;
      border: 2px solid #26364d;
      border-radius: 9px;
    }

    .preset-btn[aria-pressed="true"] {
      border-color: var(--text);
      box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 5px var(--text);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .primary-btn {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .primary-btn:hover {
      background: var(--primary-strong);
    }

    .secondary-btn:hover {
      background: var(--surface-muted);
    }

    .upgrade-container {
      display: none;
    }

    .upgrade-btn {
      width: 100%;
      border-color: #b78b00;
      background: #ffe28a;
      color: #4f3600;
    }

    .action-status {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--info-border);
      border-radius: 12px;
      background: var(--info-bg);
      color: var(--info-text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .action-status[data-tone="success"] {
      border-color: var(--success-border);
      background: var(--success-bg);
      color: var(--success-text);
    }

    .action-status[data-tone="warning"] {
      border-color: var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .premium-lock label {
      color: var(--muted);
    }

    [hidden] {
      display: none !important;
    }

    @media (forced-colors: active) {
      .preset-btn,
      .preset-btn[aria-pressed="true"] {
        border-color: ButtonText;
        box-shadow: none;
      }

      .preset-btn[aria-pressed="true"] {
        outline: 3px solid Highlight;
        outline-offset: 2px;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <header class="header">
      <h1 id="title"></h1>
      <p id="subtitle" class="subtitle"></p>
    </header>
    <section id="onboarding-guide" class="onboarding-card" aria-labelledby="onboarding-title" aria-describedby="onboarding-body onboarding-route onboarding-tip onboarding-action" hidden>
      <h2 id="onboarding-title"></h2>
      <p id="onboarding-body"></p>
      <p id="onboarding-route" class="onboarding-route"></p>
      <p id="onboarding-tip" class="onboarding-tip"></p>
      <p id="onboarding-action" class="onboarding-action"></p>
    </section>
    <section class="settings" aria-labelledby="title" aria-describedby="subtitle">
      <div id="premium-status" class="status-card" data-state="info" role="status" aria-live="polite" aria-atomic="true" aria-busy="true">Premium の状態を確認しています...</div>
      <div class="setting-item">
        <label id="label-color" for="color">色</label>
        <input type="color" id="color" value="#ffff00">
      </div>
      <div class="setting-item" id="presets-container">
        <label id="label-presets">プリセット</label>
        <div class="presets" role="group" aria-labelledby="label-presets">
          <button class="preset-btn" type="button" data-color="#ffff00" data-label-key="presetYellow" style="background:#ffff00" aria-label="黄色のプリセットを選択" aria-pressed="false"></button>
          <button class="preset-btn" type="button" data-color="#00ff00" data-label-key="presetGreen" style="background:#00ff00" aria-label="緑色のプリセットを選択" aria-pressed="false"></button>
          <button class="preset-btn" type="button" data-color="#00ffff" data-label-key="presetCyan" style="background:#00ffff" aria-label="シアンのプリセットを選択" aria-pressed="false"></button>
          <button class="preset-btn" type="button" data-color="#ff00ff" data-label-key="presetMagenta" style="background:#ff00ff" aria-label="マゼンタのプリセットを選択" aria-pressed="false"></button>
        </div>
      </div>
      <div class="setting-item">
        <label id="label-thickness" for="thickness">太さ</label>
        <div class="range-control">
          <input type="range" id="thickness" min="1" max="100" value="4" aria-describedby="thickness-value">
          <output id="thickness-value" for="thickness" aria-live="polite" aria-atomic="true">4px</output>
        </div>
      </div>
      <div class="setting-item">
        <label id="label-opacity" for="opacity">不透明度</label>
        <div class="range-control">
          <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.5" aria-describedby="opacity-value">
          <output id="opacity-value" for="opacity" aria-live="polite" aria-atomic="true">50%</output>
        </div>
      </div>
      <div class="setting-item">
        <label id="label-mode" for="mode">モード</label>
        <select id="mode">
          <option id="mode-horizontal" value="horizontal">横帯</option>
          <option id="mode-underline" value="underline">下線</option>
          <option id="mode-window" value="window">集中窓</option>
        </select>
      </div>
      <div class="setting-item checkbox-row" id="auto-on-container">
        <label id="label-auto-on" for="auto-on">このサイトでは自動的にオン</label>
        <input type="checkbox" id="auto-on">
      </div>
    </section>
    <div class="btn-group">
      <button class="primary-btn" id="toggle-on" type="button" aria-describedby="action-status">オン</button>
      <button class="secondary-btn" id="toggle-off" type="button" aria-describedby="action-status">オフ</button>
    </div>
    <div id="action-status" class="action-status" data-tone="info" role="status" aria-live="polite" aria-atomic="true" aria-busy="true">設定を読み込んでいます...</div>
    <div id="upgrade-container" class="upgrade-container">
      <button id="btn-upgrade" class="upgrade-btn" type="button" aria-describedby="premium-status"></button>
    </div>
  </main>
  <script type="module" src="src/popup.ts"></script>
</body>
</html>
